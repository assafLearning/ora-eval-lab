[project]
name = "ora-eval-lab"
version = "0.1.0"
description = "ORA evaluation infrastructure practice project — LangChain agent + Inspect evals + LangSmith observability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "inspect-ai>=0.3",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langgraph-cli[inmem]>=0.4.32",
    "langsmith>=0.14.0",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
